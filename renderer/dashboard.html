<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wellness Reminder — Setup</title>
<link rel="stylesheet" href="reminder.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="card dash-card" id="card">
    <div class="titlebar">
      <span class="pixel-dot"></span>
      <span class="app-name">WELLNESS.EXE — SETUP</span>
      <span class="mark-badge">MARK II</span>
      <button class="close-btn" id="closeBtn" type="button" aria-label="Close">&times;</button>
    </div>

    <p class="intro" id="introText">Let's set a few things up.</p>

    <div class="field">
      <label class="field-label" for="nameInput">WHAT SHOULD I CALL YOU?</label>
      <input class="text-input" id="nameInput" type="text" maxlength="40" placeholder="Your name" />
    </div>

    <div class="reminder-row" data-type="water">
      <div class="row-head">
        <div class="row-icon pixel-icon small" data-icon-for="water"></div>
        <span>DRINK WATER</span>
      </div>
      <label class="field-inline">Every <input type="number" class="num-input" id="water-interval" min="5" max="480" /> min</label>
    </div>

    <div class="reminder-row" data-type="eyes">
      <div class="row-head">
        <div class="row-icon pixel-icon small" data-icon-for="eyes"></div>
        <span>LOOK AWAY</span>
      </div>
      <label class="field-inline">Every <input type="number" class="num-input" id="eyes-interval" min="5" max="480" /> min</label>
      <label class="field-inline">for <input type="number" class="num-input" id="eyes-timer" min="1" max="60" /> min</label>
    </div>

    <div class="reminder-row" data-type="walk">
      <div class="row-head">
        <div class="row-icon pixel-icon small" data-icon-for="walk"></div>
        <span>GET UP &amp; WALK</span>
      </div>
      <label class="field-inline">Every <input type="number" class="num-input" id="walk-interval" min="5" max="480" /> min</label>
      <label class="field-inline">for <input type="number" class="num-input" id="walk-timer" min="1" max="60" /> min</label>
    </div>

    <button class="btn btn-primary save-btn" id="saveBtn" type="button">GET STARTED</button>

    <div class="stats-section" id="statsSection" hidden>
      <div class="section-title">TODAY'S PROGRESS</div>
      <div class="stat-row" data-type="water"></div>
      <div class="stat-row" data-type="eyes"></div>
      <div class="stat-row" data-type="walk"></div>
    </div>

    <div class="footer">Vibe Coded by Om Mistry</div>
  </div>

  <script src="icons.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
